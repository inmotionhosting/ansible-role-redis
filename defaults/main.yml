---
# defaults file for inmotionhosting.redis

redis_conf_bind: 127.0.0.1
redis_conf_io_threads: 1
redis_conf_lazyfree_lazy_eviction: "yes"
redis_conf_lazyfree_lazy_expire: "yes"
redis_conf_lazyfree_lazy_server_del: "yes"
redis_conf_replica_lazy_flush: "yes"
redis_conf_maxmemory: ""
redis_conf_maxmemory_policy: allkeys-lru
redis_conf_port: 6379
redis_conf_requirepass: false
redis_conf_timeout: 60
redis_conf_unixsocket_path: ""
redis_conf_unixsocket_permissions: 770
