name: Ansible Molecule Pipeline

on:  # yamllint disable-line rule:truthy
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  molecule:
    name: Molecule Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - geerlingguy/docker-ubuntu2404-ansible:latest
          - geerlingguy/docker-debian13-ansible:latest
          - combssm/docker-almalinux9-ansible:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run Molecule Test
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_IMAGE: ${{ matrix.distro }}

  molecule-legacy:
    name: Molecule Test Legacy OS
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        include:
          - image: geerlingguy/docker-centos7-ansible:latest
            command: /usr/lib/systemd/systemd
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run Molecule Test
        run: molecule test
        env:
          MOLECULE_IMAGE: ${{ matrix.image }}
          MOLECULE_COMMAND: ${{ matrix.command }}
