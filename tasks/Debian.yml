---
# Install Redis from the official Redis repository for Debian/Ubuntu
# See: https://redis.io/docs/latest/operate/oss_and_stack/install/install-redis-on-linux/

- name: (Debian/Ubuntu) Install Redis GPG key
  ansible.builtin.get_url:
    url: https://packages.redis.io/gpg
    dest: /etc/apt/trusted.gpg.d/redis.asc
    mode: "0644"

- name: (Debian/Ubuntu) Add official Redis repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/trusted.gpg.d/redis.asc] https://packages.redis.io/deb {{ ansible_distribution_release }} main"
    state: present
    filename: redis
    update_cache: true

- name: (Debian/Ubuntu) Install Redis from official repository
  ansible.builtin.apt:
    name: "{{ redis_package }}"
    state: present
  register: redis_installed
