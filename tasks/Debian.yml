---
# Install Redis from the official Redis repository for Debian/Ubuntu
# See: https://redis.io/docs/latest/operate/oss_and_stack/install/install-redis-on-linux/

- name: (Debian/Ubuntu) Install required packages for Redis repository
  ansible.builtin.apt:
    name:
      - curl
      - gpg
    state: present
    update_cache: true

- name: (Debian/Ubuntu) Create keyrings directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: (Debian/Ubuntu) Download Redis GPG key
  ansible.builtin.get_url:
    url: https://packages.redis.io/gpg
    dest: /tmp/redis-archive-keyring.gpg
    mode: "0644"

- name: (Debian/Ubuntu) Dearmor and install Redis GPG key
  ansible.builtin.shell:
    cmd: gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg < /tmp/redis-archive-keyring.gpg
    creates: /usr/share/keyrings/redis-archive-keyring.gpg

- name: (Debian/Ubuntu) Set permissions on Redis GPG key
  ansible.builtin.file:
    path: /usr/share/keyrings/redis-archive-keyring.gpg
    mode: "0644"

- name: (Debian/Ubuntu) Add official Redis repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb {{ ansible_distribution_release }} main"
    state: present
    filename: redis

- name: (Debian/Ubuntu) Update APT cache
  ansible.builtin.apt:
    update_cache: true

- name: (Debian/Ubuntu) Install Redis from official repository
  ansible.builtin.apt:
    name: "{{ redis_package }}"
    state: present
  register: redis_installed
