---

- name: (Debian) Include os_family vars
  ansible.builtin.include_vars: Debian.yml
  when: ansible_os_family == "Debian"

- name: Set lists of required variables
  ansible.builtin.set_fact:
    redis_required_strings:
      - redis_conf
      - redis_daemon
      - redis_conf_bind
      - redis_conf_daemonize
      - redis_conf_supervised
      - redis_conf_pidfile
      - redis_conf_logfile
      - redis_conf_maxmemory
      - redis_conf_maxmemory_policy
      - redis_package
    redis_required_ints:
      - redis_conf_timeout
      - redis_conf_port

- name: Check required Redis variables (strings)
  ansible.builtin.fail:
    msg: |
      Invalid value for variable for '{{ item }}': {{ lookup('vars', item) }}

      Supported types  : String
      Supported values : Any non-null string
  when: lookup('vars', item) is not string
  with_items: "{{ redis_required_strings }}"

- name: Check required Redis variables (integers)
  ansible.builtin.fail:
    msg: |
      Invalid value for variable for '{{ item }}': {{ lookup('vars', item) }}

      Supported types  : Integer
      Supported values : A number between 0-65535
  when: >-
    lookup('vars', item)|int < 0
    or lookup('vars', item)|int > 65535
  with_items: "{{ redis_required_ints }}"

- name: Check variable 'systemd_restart_setting'
  ansible.builtin.fail:
    msg: |
      Invalid value for variable 'systemd_restart_setting': '{{ systemd_restart_setting }}'

      Supported types  : String
      Supported values : "no", "on-success", "on-failure", "on-abnormal",
                         "on-watchdog", "on-abort", "always"
  when:
    - (redis_systemd_restart | default(false)) or (systemd_restart | default(false))
    - >-
      systemd_restart_setting is not string
      or systemd_restart_setting not in
      ['no', 'on-success', 'on-failure', 'on-abnormal',
      'on-watchdog', 'on-abort', 'always']

- name: Check variable 'redis_conf_unixsocket'
  ansible.builtin.fail:
    msg: |
      Invalid value for variable 'redis_conf_unixsocket': '{{ redis_conf_unixsocket }}'

      Supported types  : Boolean
      Supported values : true, false
  when: redis_conf_unixsocket is not sameas true and redis_conf_unixsocket is not sameas false

- name: Check variable 'redis_conf_unixsocket_location'
  ansible.builtin.fail:
    msg: |
      Invalid value for variable 'redis_conf_unixsocket_location': '{{ redis_conf_unixsocket_location }}'

      Supported types  : String
      Supported values : Any non-null string (path to socket file)
  when:
    - redis_conf_unixsocket | bool
    - redis_conf_unixsocket_location is not string or redis_conf_unixsocket_location | length == 0

- name: Check variable 'redis_module_stream'
  ansible.builtin.fail:
    msg: |
      Invalid value for variable 'redis_module_stream': '{{ redis_module_stream }}'

      Supported types  : String
      Supported values : Any non-null string (e.g., 'remi-8.4', 'remi-7.2')
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 8
    - redis_module_stream is not string or redis_module_stream | length == 0

- name: Check variable 'redis_conf_unixsocket_permissions'
  ansible.builtin.fail:
    msg: |
      Invalid value for variable 'redis_conf_unixsocket_permissions': '{{ redis_conf_unixsocket_permissions }}'

      Supported types  : Integer
      Supported values : Unix file permissions (e.g., 770, 755, 700)
  when:
    - redis_conf_unixsocket | bool
    - redis_conf_unixsocket_permissions | int < 0 or redis_conf_unixsocket_permissions | int > 777
