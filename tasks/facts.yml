---
# Custom validations not covered by argument_specs

- name: Check variable 'redis_conf_port' (valid port range)
  ansible.builtin.fail:
    msg: |
      Invalid value for variable 'redis_conf_port': '{{ redis_conf_port }}'

      Supported values : A port number between 0-65535
  when: redis_conf_port | int < 0 or redis_conf_port | int > 65535

- name: Check variable 'redis_conf_timeout' (non-negative)
  ansible.builtin.fail:
    msg: |
      Invalid value for variable 'redis_conf_timeout': '{{ redis_conf_timeout }}'

      Supported values : 0 (disabled) or any positive integer (seconds)
  when: redis_conf_timeout | int < 0

- name: Check variable 'redis_conf_bind' (valid IP addresses)
  ansible.builtin.fail:
    msg: |
      Invalid value for variable 'redis_conf_bind': '{{ redis_conf_bind }}'

      Supported values : Valid IPv4 or IPv6 address(es), space-separated
  when: >-
    redis_conf_bind | length == 0
    or redis_conf_bind.split() | map('ansible.utils.ipaddr') | select('eq', false) | list | length > 0

- name: Check variable 'redis_conf_unixsocket_location' (required when socket enabled)
  ansible.builtin.fail:
    msg: |
      Invalid value for variable 'redis_conf_unixsocket_location': '{{ redis_conf_unixsocket_location }}'

      Supported values : Any non-empty string (path to socket file)
  when:
    - redis_conf_unixsocket | bool
    - redis_conf_unixsocket_location | length == 0

- name: Check variable 'redis_conf_unixsocket_permissions' (valid octal range)
  ansible.builtin.fail:
    msg: |
      Invalid value for variable 'redis_conf_unixsocket_permissions': '{{ redis_conf_unixsocket_permissions }}'

      Supported values : Unix file permissions (e.g., 770, 755, 700)
  when:
    - redis_conf_unixsocket | bool
    - redis_conf_unixsocket_permissions | int < 0 or redis_conf_unixsocket_permissions | int > 777
