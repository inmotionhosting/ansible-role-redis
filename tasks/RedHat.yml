---
- name: (RedHat) Install Remi repo
  ansible.builtin.dnf:
    name: "https://rpms.remirepo.net/enterprise/remi-release-{{ ansible_distribution_major_version }}.rpm"
    state: present
    disable_gpg_check: true
  retries: 3
  delay: 5
  register: remi_repo
  until: remi_repo is success

- name: (RedHat EL7) Install Redis
  ansible.builtin.dnf:
    name: redis
    enablerepo: remi
    state: present
  when: ansible_distribution_major_version == "7"

- name: (RedHat EL8+) Check current Redis module stream
  ansible.builtin.command:
    cmd: dnf module list --enabled redis
  register: redis_module_enabled
  changed_when: false
  failed_when: false
  when: ansible_distribution_major_version | int >= 8

- name: (RedHat EL8+) Handle module stream switch
  when:
    - ansible_distribution_major_version | int >= 8
    - redis_module_enabled.rc == 0
    - redis_module_stream not in redis_module_enabled.stdout
  block:
    - name: (RedHat EL8+) Remove Redis before stream switch
      ansible.builtin.dnf:
        name: redis
        state: absent

    - name: (RedHat EL8+) Reset Redis module stream
      ansible.builtin.command:
        cmd: dnf module reset redis -y
      changed_when: true

- name: (RedHat EL8+) Install Redis
  ansible.builtin.dnf:
    name: "@redis:{{ redis_module_stream }}"
    state: present
  when: ansible_distribution_major_version | int >= 8
