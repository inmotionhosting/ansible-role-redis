---
- name: (RedHat) Add Remi repository GPG key
  ansible.builtin.rpm_key:
    state: present
    key: "https://rpms.remirepo.net/RPM-GPG-KEY-{{ target }}"
  vars:
    target: >-
      {{ "remi2021" if version | int == 9
      else ("remi2018" if version | int == 8
      else ("remi" if version | int == 7
      else "remi2023")) }}
    version: "{{ ansible_distribution_major_version }}"

- name: (RedHat) Install Remi repo
  ansible.builtin.package:
    name: "https://rpms.remirepo.net/enterprise/remi-release-{{ ansible_distribution_major_version }}.rpm"
    state: present

- name: (RedHat EL7) Install Redis
  ansible.builtin.package:
    name: redis
    enablerepo: "remi"
    state: present
  register: redis_installed
  when: ansible_distribution_major_version == "7"

- name: (RedHat EL8+) Enable Redis module stream
  ansible.builtin.dnf:
    name: "@redis:{{ redis_module_stream }}"
    state: present
  register: redis_installed
  when: ansible_distribution_major_version | int > 7
