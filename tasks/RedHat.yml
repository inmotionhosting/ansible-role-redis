---
# Install Redis from the Remi repository for RHEL/CentOS/AlmaLinux/RockyLinux
# See: https://rpms.remirepo.net/

- name: (RedHat) Install Remi repo
  ansible.builtin.dnf:
    name: "https://rpms.remirepo.net/enterprise/remi-release-{{ ansible_facts['distribution_major_version'] }}.rpm"
    state: present
    disable_gpg_check: true
  retries: 3
  delay: 5
  register: remi_repo
  until: remi_repo is success

- name: (RedHat EL7) Install Redis from Remi
  ansible.builtin.dnf:
    name: redis
    enablerepo: remi
    state: present
  when: ansible_facts['distribution_major_version'] == "7"

- name: (RedHat EL8+) Check current Redis module stream
  ansible.builtin.command:
    cmd: dnf module list --enabled redis
  register: redis_module_enabled
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution_major_version'] | int >= 8

- name: (RedHat EL8+) Switch Redis module stream
  ansible.builtin.command:
    cmd: dnf module switch-to redis:remi-{{ redis_module_stream }} -y
  when:
    - ansible_facts['distribution_major_version'] | int >= 8
    - redis_module_enabled.rc == 0
    - ("remi-" ~ redis_module_stream) not in redis_module_enabled.stdout
  changed_when: true
  notify: Restart redis

- name: (RedHat EL8+) Install Redis from Remi module stream
  ansible.builtin.dnf:
    name: "@redis:remi-{{ redis_module_stream }}"
    state: present
  when: ansible_facts['distribution_major_version'] | int >= 8
