---
- name: Converge
  hosts: all

  pre_tasks:
    - name: Display current distribution info
      ansible.builtin.debug:
        msg: >-
          Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}
          ({{ ansible_distribution_release }}) - OS Family: {{ ansible_os_family }}

    - name: Update apt cache (on Debian).
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

- name: Test module stream switching (RedHat only)
  hosts: all
  tasks:
    - name: Test Redis module stream switch from 8.2 to 8.4
      when: ansible_os_family == 'RedHat' and ansible_distribution_major_version | int >= 8
      block:
        - name: Install Redis with module stream remi-8.2
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            redis_module_stream: remi-8.2

        - name: Verify Redis 8.2 is installed
          ansible.builtin.command:
            cmd: redis-server --version
          register: redis_version_82
          changed_when: false

        - name: Display Redis version after 8.2 install
          ansible.builtin.debug:
            var: redis_version_82.stdout

        - name: Switch to Redis module stream remi-8.4
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            redis_module_stream: remi-8.4

        - name: Verify Redis 8.4 is installed
          ansible.builtin.command:
            cmd: redis-server --version
          register: redis_version_84
          changed_when: false

        - name: Display Redis version after 8.4 install
          ansible.builtin.debug:
            var: redis_version_84.stdout

        - name: Assert version changed
          ansible.builtin.assert:
            that:
              - "'8.2' in redis_version_82.stdout"
              - "'8.4' in redis_version_84.stdout"
            fail_msg: "Module stream switch failed - versions did not change as expected"
            success_msg: "Module stream switch successful - upgraded from 8.2 to 8.4"
