---
- name: Converge
  hosts: all

  pre_tasks:
    - name: Display Molecule environment variables
      ansible.builtin.debug:
        msg:
          MOLECULE_PROJECT_DIRECTORY: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          MOLECULE_SCENARIO_NAME: "{{ lookup('env', 'MOLECULE_SCENARIO_NAME') }}"
          MOLECULE_INSTANCE_CONFIG: "{{ lookup('env', 'MOLECULE_INSTANCE_CONFIG') }}"
          MOLECULE_EPHEMERAL_DIRECTORY: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"

    - name: Display current distribution info
      ansible.builtin.debug:
        msg: >-
          Distribution: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          ({{ ansible_facts['distribution_release'] }}) - OS Family: {{ ansible_facts['os_family'] }}

    - name: Display runtime versions
      ansible.builtin.debug:
        msg:
          ansible_version: "{{ ansible_version.full }}"
          python_version: "{{ ansible_facts['python_version'] }}"

    - name: Update apt cache (on Debian).
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
