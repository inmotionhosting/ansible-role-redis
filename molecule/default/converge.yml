---
- name: Converge
  hosts: all

  pre_tasks:
    - name: Display current distribution info
      ansible.builtin.debug:
        msg: >-
          Distribution: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          ({{ ansible_facts['distribution_release'] }}) - OS Family: {{ ansible_facts['os_family'] }}

    - name: Update apt cache (on Debian).
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

  roles:
    - role: 'inmotionhosting.redis'
